version: "2"

linters:
  default: none
  enable:
    - errcheck
    - govet
    - ineffassign
    - misspell
    - revive
    - staticcheck
    - unused
  settings:
    revive:
      rules:
        # Comentários obrigatórios em todo símbolo exportado geram ruído
        # cerimonial; comentamos apenas o que não é óbvio (ver AGENTS.md).
        - name: exported
          disabled: true

formatters:
  enable:
    - gofmt
    - goimports

run:
  timeout: 5m
