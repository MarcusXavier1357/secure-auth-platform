# Serve a SPA com fallback para index.html (React Router)
server {
    listen 80;

    root /usr/share/nginx/html;
    index index.html;

    # index.html sempre revalidado — evita bundle JS desatualizado após deploy
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        try_files $uri =404;
    }

    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
