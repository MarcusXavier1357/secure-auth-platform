# Em produção, este bloco deve ser servido via TLS (listen 443 ssl) com
# certificados válidos e redirect de 80 para 443. HTTP simples é apenas para dev.
server {
    listen 80;
    server_name _;

    # Endpoints da API
    location /api/ {
        proxy_pass http://api:8080/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SPA React
    location / {
        proxy_pass http://frontend:80;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
